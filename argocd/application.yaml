apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freeswitch-monitoring-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/QTune1603/ArgoCD-freeswitch.git'
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: freeswitch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
