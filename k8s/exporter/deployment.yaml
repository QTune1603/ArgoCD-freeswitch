apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeswitch-exporter
  namespace: freeswitch
  labels:
    app: freeswitch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freeswitch-exporter
  template:
    metadata:
      labels:
        app: freeswitch-exporter
    spec:
      containers:
      - name: freeswitch-exporter
        image: florentchauveau/freeswitch_exporter:latest
        args:
        - -server
        - freeswitch-service:8021
        - -password
        - ClueCon
        ports:
        - containerPort: 9282
          name: metrics
