apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeswitch
  namespace: freeswitch
  labels:
    app: freeswitch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freeswitch
  template:
    metadata:
      labels:
        app: freeswitch
    spec:
      containers:
      - name: freeswitch
        image: safarov/freeswitch:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          if [ ! -f "/etc/freeswitch/freeswitch.xml" ]; then
            mkdir -p /etc/freeswitch
            cp -varf /usr/share/freeswitch/conf/vanilla/* /etc/freeswitch/
          fi
          sed -i -E 's/.*default_password=.*/  <X-PRE-PROCESS cmd="set" data="default_password=1234"\/>/g' /etc/freeswitch/vars.xml
          sed -i 's/stun:stun.freeswitch.org/auto/g' /etc/freeswitch/vars.xml
          exec /usr/bin/freeswitch -nc -nf -nonat
        ports:
        - containerPort: 8021
          name: esl
        - containerPort: 5060
          name: sip-udp
          protocol: UDP
        - containerPort: 5060
          name: sip-tcp
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /etc/freeswitch/autoload_configs/event_socket.conf.xml
          subPath: event_socket.conf.xml
        - name: config-volume
          mountPath: /etc/freeswitch/autoload_configs/acl.conf.xml
          subPath: acl.conf.xml
      volumes:
      - name: config-volume
        configMap:
          name: freeswitch-config




